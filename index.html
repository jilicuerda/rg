<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Cloud Calendar</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="login-screen">
        <h1>Welcome Back</h1>
        <div id="login-error" class="error-message"></div>
        <input type="text" id="username" placeholder="Username" autocomplete="off">
        <input type="password" id="password" placeholder="Password">
        <button class="btn-primary" onclick="attemptLogin()">Log In</button>
    </div>

    <div id="app-dashboard" class="hidden">
        
        <header class="top-nav">
            <div class="nav-left">
                <button class="btn-outline" onclick="jumpToToday()">📅 Today</button>
                <button class="icon-btn" onclick="navigateTime(-1)">❮</button>
                <button class="icon-btn" onclick="navigateTime(1)">❯</button>
                <span class="date-range-display" id="week-date-range">...</span>
            </div>
            
            <div class="nav-right">
                <label for="site-bg-upload" class="btn-outline" style="cursor: pointer; margin-right: 15px;" title="Change Site Background">
                    🖼️ Background
                </label>
                <input type="file" id="site-bg-upload" accept="image/*" class="hidden" onchange="updateSiteBackground(event)">

                <span style="font-size: 13px; color: var(--text-muted); margin-right: 10px;">
                    User: <strong id="user-display-name"></strong>
                </span>
                
                <select id="view-selector" class="select-outline" onchange="changeView(this.value)">
                    <option value="day">Day</option>
                    <option value="workweek">Work Week</option>
                    <option value="week" selected>Week</option>
                    <option value="month">Month</option> </select>

                <button class="btn-outline" onclick="logout()">Log Out</button>
            </div>
        </header>

        <div class="workspace">
            <div class="calendar-container" id="calendar-container">
                <div class="calendar-grid view-week" id="calendar-grid">
                    </div>
            </div>

            <div class="sidebar">
                <h3>To-Do List</h3>
                <div class="todo-input-group">
                    <input type="color" id="todo-color" class="color-picker" value="#5b5fc7" title="Task Color">
                    <label for="todo-image" class="file-btn" title="Add Image to Task">📸</label>
                    <input type="file" id="todo-image" accept="image/*" class="hidden">
                    
                    <input type="text" id="new-todo" placeholder="Add task..." onkeypress="handleTodoKeyPress(event)">
                    <button class="btn-primary" onclick="addTodo()" id="add-btn">+</button>
                </div>
                <ul id="todo-list">
                    </ul>

                <div id="admin-panel" class="hidden">
                    <h3 style="color: var(--danger-color); font-size: 14px;">Admin Area</h3>
                    <button class="btn-danger" onclick="clearAllData()">Clear Cloud Database</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
